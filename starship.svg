<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" shape-rendering="crispEdges">
<style>
.tw{animation:tw ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.st{animation:st linear infinite}
@keyframes st{from{transform:translateX(0)}to{transform:translateX(-600px)}}
.bit{animation:bit linear infinite}
@keyframes bit{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-170px);opacity:0}}
.ship{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.fl{animation:fl .18s steps(2) infinite;transform-origin:190px 100px}
@keyframes fl{from{transform:scaleX(1)}to{transform:scaleX(.6)}}
</style>
